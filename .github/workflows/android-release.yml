name: Android CI/CD (Linux)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Tạo GitHub Release (true/false)'
        required: false
        default: 'false'
        type: boolean
      release_tag:
        description: 'Tag cho Release (ví dụ v1.0.1)'
        required: false
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build Android APK (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Android SDK & Accept Licenses
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/licenses" || true
          # Accept standard licenses
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          # Install platform 36 if not already cached
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" || true

      - name: Generate Signing Keystores
        run: |
          keytool -genkeypair -v -keystore my-upload-key.jks \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=SmartFire AI, OU=SOV Labs, O=STEM, L=HCMC, C=VN"
          keytool -genkeypair -v -keystore debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug, O=Android, C=US"

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Release & Debug APKs
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Organize APK Artifacts
        id: organize_apks
        run: |
          mkdir -p artifacts
          REF_NAME="${GITHUB_REF_NAME:-latest}"
          TAG_CLEAN=$(echo "$REF_NAME" | sed 's|refs/tags/||; s|refs/heads/||; s|/|-|g')
          
          # Copy release APK
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "artifacts/SmartFire-AI-${TAG_CLEAN}-release.apk"
            echo "RELEASE_FILE=artifacts/SmartFire-AI-${TAG_CLEAN}-release.apk" >> $GITHUB_ENV
          fi

          # Copy debug APK
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "artifacts/SmartFire-AI-${TAG_CLEAN}-debug.apk"
            echo "DEBUG_FILE=artifacts/SmartFire-AI-${TAG_CLEAN}-debug.apk" >> $GITHUB_ENV
          fi

          ls -la artifacts/

      - name: Upload APKs to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartFire-AI-APKs
          path: artifacts/*
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.release_tag || 'v1.0.0' }}
          name: SmartFire AI ${{ github.ref_name || github.event.inputs.release_tag || 'v1.0.0' }}
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
